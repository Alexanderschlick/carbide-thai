name: Update Prices from HM24

on:
  schedule:
    # 08:00 Bangkok time = 01:00 UTC (UTC+7)
    - cron: '0 1 * * *'
    # 20:00 Bangkok time = 13:00 UTC (UTC+7)
    - cron: '0 13 * * *'
  workflow_dispatch:   # manual trigger from GitHub Actions UI

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit prices.json back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4

      - name: Run HM24 price scraper
        env:
          SUPABASE_URL:          https://ltupwgytuayzopnsdvpc.supabase.co
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scraper/scrape_prices.py

      - name: Commit updated prices.json
        run: |
          git config user.name "CarbideThai Bot"
          git config user.email "bot@carbidethai.com"
          git add prices.json
          git diff --staged --quiet || git commit -m "chore: update prices from HM24 $(date -u +%Y-%m-%d)"
          git push
