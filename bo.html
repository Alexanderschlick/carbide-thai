<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ThaiCarbide BO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --header-bg: #1a1a2e;
  --header-accent: #16213e;
  --accent-green: #27ae60;
  --accent-green-light: #2ecc71;
  --accent-orange: #f39c12;
  --accent-red: #e74c3c;
  --accent-blue: #3498db;
  --accent-purple: #9b59b6;
  --bg-primary: #f5f6fa;
  --bg-white: #ffffff;
  --text-primary: #2c3e50;
  --text-secondary: #7f8c8d;
  --text-light: #bdc3c7;
  --border: #e0e0e0;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.12);
  --radius: 8px;
  --radius-sm: 4px;
  --transition: 0.2s ease;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height:100vh; }
button { cursor:pointer; font-family:inherit; }
input, select, textarea { font-family:inherit; font-size:14px; }

/* Login */
#login-screen {
  display:flex; align-items:center; justify-content:center; min-height:100vh;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
}
.login-card {
  background: var(--bg-white); border-radius: 16px; padding: 48px 40px; width: 400px; max-width:90vw;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align:center;
}
.login-logo { font-size:32px; font-weight:800; color: var(--header-bg); margin-bottom:4px; letter-spacing:-0.5px; }
.login-logo span { color: var(--accent-green); }
.login-subtitle { color: var(--text-secondary); font-size:14px; margin-bottom:32px; }
.login-input {
  width:100%; padding:14px 16px; border:2px solid var(--border); border-radius: var(--radius);
  font-size:16px; outline:none; transition: border-color var(--transition); margin-bottom:16px;
}
.login-input:focus { border-color: var(--accent-green); }
.login-btn {
  width:100%; padding:14px; background: var(--accent-green); color:#fff; border:none;
  border-radius: var(--radius); font-size:16px; font-weight:600; transition: background var(--transition);
}
.login-btn:hover { background: #219a52; }
.login-error { color: var(--accent-red); font-size:13px; margin-top:12px; min-height:20px; }

/* App shell */
#app { display:none; }
.header {
  background: var(--header-bg); color:#fff; padding:0 24px; height:56px;
  display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100;
}
.header-left { display:flex; align-items:center; gap:16px; }
.brand { font-size:20px; font-weight:700; letter-spacing:-0.3px; }
.brand span { color: var(--accent-green); }
.header-meta { display:flex; align-items:center; gap:12px; font-size:12px; color: var(--text-light); }
.header-meta .role-badge {
  background: var(--accent-green); color:#fff; padding:2px 10px; border-radius:12px;
  font-size:11px; font-weight:600; text-transform:uppercase;
}
.header-meta .role-badge.partner { background: var(--accent-orange); }
.header-btn {
  background: rgba(255,255,255,0.1); border:none; color:#fff; padding:6px 14px;
  border-radius: var(--radius-sm); font-size:13px; transition: background var(--transition);
}
.header-btn:hover { background: rgba(255,255,255,0.2); }
.header-right { display:flex; align-items:center; gap:8px; }

/* Tabs */
.tab-bar {
  background: var(--bg-white); border-bottom:1px solid var(--border); display:flex;
  padding:0 24px; overflow-x:auto; position:sticky; top:56px; z-index:99;
}
.tab-btn {
  padding:14px 20px; background:none; border:none; border-bottom:3px solid transparent;
  font-size:14px; font-weight:500; color: var(--text-secondary); white-space:nowrap;
  transition: all var(--transition);
}
.tab-btn:hover { color: var(--text-primary); }
.tab-btn.active { color: var(--accent-green); border-bottom-color: var(--accent-green); }

/* Content area */
.content { padding:24px; max-width:1400px; margin:0 auto; }
.tab-content { display:none; }
.tab-content.active { display:block; animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }

/* Cards */
.card-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap:16px; margin-bottom:24px; }
.card {
  background: var(--bg-white); border-radius: var(--radius); padding:20px; box-shadow: var(--shadow);
}
.card-label { font-size:12px; color: var(--text-secondary); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:8px; }
.card-value { font-size:28px; font-weight:700; }
.card-value.green { color: var(--accent-green); }
.card-value.orange { color: var(--accent-orange); }
.card-sub { font-size:12px; color: var(--text-secondary); margin-top:4px; }

/* Section */
.section { background: var(--bg-white); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom:24px; }
.section-header { padding:16px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.section-title { font-size:16px; font-weight:600; }
.section-body { padding:20px; }

/* Tables */
.table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { text-align:left; padding:10px 12px; background: var(--bg-primary); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:0.3px; color: var(--text-secondary); white-space:nowrap; }
td { padding:10px 12px; border-bottom:1px solid #f0f0f0; vertical-align:middle; }
tr:hover td { background: #fafbfc; }

/* Badges */
.badge {
  display:inline-block; padding:3px 10px; border-radius:12px; font-size:11px;
  font-weight:600; text-transform:capitalize;
}
.badge-pending { background:#ecf0f1; color:#7f8c8d; }
.badge-delivered { background:#ebf5fb; color:#2980b9; }
.badge-weighed { background:#fef9e7; color:#d68910; }
.badge-paid { background:#eafaf1; color:#27ae60; }
.badge-settled { background:#f4ecf7; color:#8e44ad; }
.badge-new { background:#ebf5fb; color:#2980b9; }
.badge-qualifying { background:#fef9e7; color:#d68910; }
.badge-quoted { background:#fdebd0; color:#e67e22; }
.badge-hot { background:#fdedec; color:#e74c3c; }
.badge-deal { background:#eafaf1; color:#27ae60; }
.badge-lost { background:#ecf0f1; color:#7f8c8d; }
.badge-none { background:#ecf0f1; color:#7f8c8d; }
.badge-reserved { background:#ebf5fb; color:#2980b9; }
.badge-shipped { background:#fef9e7; color:#d68910; }
.badge-completed { background:#eafaf1; color:#27ae60; }

/* Buttons */
.btn {
  padding:8px 16px; border-radius: var(--radius-sm); font-size:13px; font-weight:500;
  border:none; transition: all var(--transition); display:inline-flex; align-items:center; gap:6px;
}
.btn-primary { background: var(--accent-green); color:#fff; }
.btn-primary:hover { background:#219a52; }
.btn-secondary { background: var(--bg-primary); color: var(--text-primary); border:1px solid var(--border); }
.btn-secondary:hover { background:#eee; }
.btn-sm { padding:5px 10px; font-size:12px; }
.btn-orange { background: var(--accent-orange); color:#fff; }
.btn-orange:hover { background:#d68910; }
.btn-danger { background: var(--accent-red); color:#fff; }
.btn-danger:hover { background:#c0392b; }

/* Modal */
.modal-overlay {
  display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:200;
  align-items:center; justify-content:center; padding:20px;
}
.modal-overlay.open { display:flex; }
.modal {
  background: var(--bg-white); border-radius:12px; width:560px; max-width:100%;
  max-height:90vh; overflow-y:auto; box-shadow: var(--shadow-lg);
}
.modal-header { padding:20px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
.modal-title { font-size:18px; font-weight:600; }
.modal-close { background:none; border:none; font-size:20px; color: var(--text-secondary); padding:4px; }
.modal-body { padding:24px; }
.modal-footer { padding:16px 24px; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:8px; }

/* Form */
.form-group { margin-bottom:16px; }
.form-label { display:block; font-size:13px; font-weight:500; margin-bottom:6px; color: var(--text-primary); }
.form-input {
  width:100%; padding:10px 12px; border:1px solid var(--border); border-radius: var(--radius-sm);
  font-size:14px; outline:none; transition: border-color var(--transition);
}
.form-input:focus { border-color: var(--accent-green); }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

/* Prices grid */
.prices-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); gap:16px; }
.price-card {
  background: var(--bg-white); border:1px solid var(--border); border-radius: var(--radius); padding:20px;
}
.price-card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.price-card-name { font-weight:600; font-size:15px; }
.price-card-name-th { font-size:12px; color: var(--text-secondary); }
.price-tier { display:flex; justify-content:space-between; padding:6px 0; font-size:13px; border-bottom:1px solid #f5f5f5; }
.price-tier:last-child { border-bottom:none; }
.price-tier-label { color: var(--text-secondary); }
.price-tier-value { font-weight:600; color: var(--accent-green); }
.price-updated { font-size:11px; color: var(--text-light); margin-top:8px; }

/* Activity feed */
.activity-item { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid #f5f5f5; }
.activity-item:last-child { border-bottom:none; }
.activity-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.activity-text { font-size:13px; flex:1; }
.activity-time { font-size:11px; color: var(--text-light); white-space:nowrap; }

/* Score bar */
.score-bar { width:60px; height:6px; background:#ecf0f1; border-radius:3px; overflow:hidden; display:inline-block; vertical-align:middle; margin-right:6px; }
.score-fill { height:100%; border-radius:3px; }

/* Toast */
.toast-container { position:fixed; top:70px; right:20px; z-index:300; display:flex; flex-direction:column; gap:8px; }
.toast {
  padding:12px 20px; border-radius: var(--radius); color:#fff; font-size:13px; font-weight:500;
  box-shadow: var(--shadow-lg); animation: slideIn 0.3s ease; min-width:250px;
}
.toast-success { background: var(--accent-green); }
.toast-error { background: var(--accent-red); }
@keyframes slideIn { from { opacity:0; transform:translateX(40px); } to { opacity:1; transform:translateX(0); } }

/* Spinner */
.spinner { display:inline-block; width:20px; height:20px; border:2px solid var(--border); border-top-color: var(--accent-green); border-radius:50%; animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.loading-center { display:flex; justify-content:center; align-items:center; padding:60px; }

/* Export summary cards */
.export-summary { display:grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap:12px; margin-bottom:20px; }
.export-card { background: var(--bg-primary); border-radius: var(--radius-sm); padding:14px; }
.export-buyer-name { font-weight:600; font-size:14px; margin-bottom:4px; }
.export-stat { font-size:13px; color: var(--text-secondary); }
.export-stat strong { color: var(--text-primary); }

/* Settings */
.settings-section { margin-bottom:24px; }
.settings-row { display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid #f5f5f5; }
.settings-label { font-size:14px; }
.settings-value { font-size:14px; font-weight:500; }
.status-dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px; }
.status-dot.ok { background: var(--accent-green); }
.status-dot.err { background: var(--accent-red); }

/* Empty state */
.empty-state { text-align:center; padding:40px; color: var(--text-secondary); }
.empty-state-icon { font-size:40px; margin-bottom:8px; opacity:0.3; }

/* Marketing channel cards */
.mkt-channels { display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap:16px; margin-bottom:24px; }
.mkt-card {
  background: var(--bg-white); border-radius: var(--radius); padding:20px; box-shadow: var(--shadow);
  border-left: 4px solid var(--border); position:relative;
}
.mkt-card.status-ok { border-left-color: var(--accent-green); }
.mkt-card.status-warn { border-left-color: var(--accent-orange); }
.mkt-card.status-off { border-left-color: var(--accent-red); }
.mkt-card.status-info { border-left-color: var(--accent-blue); }
.mkt-card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.mkt-card-title { font-weight:600; font-size:14px; display:flex; align-items:center; gap:8px; }
.mkt-card-icon { font-size:18px; }
.mkt-card-status { font-size:11px; font-weight:600; padding:2px 8px; border-radius:10px; text-transform:uppercase; }
.mkt-status-active { background:#eafaf1; color:#27ae60; }
.mkt-status-warning { background:#fef9e7; color:#d68910; }
.mkt-status-inactive { background:#fdedec; color:#e74c3c; }
.mkt-status-nodata { background:#ecf0f1; color:#7f8c8d; }
.mkt-card-body { font-size:13px; color: var(--text-secondary); }
.mkt-card-metric { font-size:22px; font-weight:700; color: var(--text-primary); margin:4px 0; }
.mkt-card-detail { font-size:12px; color: var(--text-light); margin-top:6px; }
.mkt-card-link { display:inline-block; margin-top:8px; font-size:12px; color: var(--accent-blue); text-decoration:none; }
.mkt-card-link:hover { text-decoration:underline; }

/* Cron table */
.cron-schedule { font-family: 'SF Mono', 'Fira Code', monospace; font-size:11px; background:#f0f0f0; padding:2px 6px; border-radius:3px; }
.cron-freq { font-size:11px; color: var(--text-secondary); }

/* Responsive */
@media (max-width:768px) {
  .content { padding:16px; }
  .card-grid { grid-template-columns: repeat(2,1fr); gap:10px; }
  .card { padding:14px; }
  .card-value { font-size:22px; }
  .header { padding:0 12px; }
  .tab-btn { padding:12px 14px; font-size:13px; }
  .form-row { grid-template-columns:1fr; }
  .prices-grid { grid-template-columns:1fr; }
  .modal { width:100%; margin:10px; }
  .header-meta .last-update { display:none; }
  table { font-size:12px; }
  th, td { padding:8px 6px; }
  .mkt-channels { grid-template-columns: 1fr 1fr; }
}
@media (max-width:480px) {
  .card-grid { grid-template-columns:1fr 1fr; gap:8px; }
  .card { padding:12px; }
  .card-value { font-size:20px; }
  .mkt-channels { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- Login Screen -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">Thai<span>Carbide</span></div>
    <div class="login-subtitle">Back Office Dashboard</div>
    <input type="password" id="login-password" class="login-input" placeholder="Enter password" autocomplete="off">
    <button class="login-btn" onclick="handleLogin()">Sign In</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- App -->
<div id="app">
  <header class="header">
    <div class="header-left">
      <div class="brand">Thai<span>Carbide</span> BO</div>
    </div>
    <div class="header-meta">
      <span class="last-update" id="last-update"></span>
      <span class="role-badge" id="role-badge"></span>
    </div>
    <div class="header-right">
      <button class="header-btn" onclick="refreshCurrent()">&#8635; Refresh</button>
      <button class="header-btn" onclick="handleLogout()">Logout</button>

  </header>

  <nav class="tab-bar" id="tab-bar"></nav>

  <main class="content">

        <div class="section-body"><div class="prices-grid" id="prices-grid"></div></div>
      </div>
      <div class="section">
        <div class="section-header"><div class="section-title">Recent Activity</div></div>
        <div class="section-body" id="activity-feed"></div>
      </div>
    </div>

    <!-- Parcels -->
    <div class="tab-content" id="tab-parcels">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px;">
        <h2 style="font-size:18px;font-weight:600;">Parcels</h2>
        <div id="parcel-actions"></div>
      </div>
      <div class="section"><div class="table-wrap" id="parcels-table"></div></div>

    <!-- Leads -->

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px;">
        <h2 style="font-size:18px;font-weight:600;">Leads</h2>
        <div id="lead-actions"></div>
      </div>
      <div class="section"><div class="table-wrap" id="leads-table"></div></div>
    </div>

    <!-- Export -->
    <div class="tab-content" id="tab-export">
      <h2 style="font-size:18px;font-weight:600;margin-bottom:16px;">Export Pipeline</h2>
      <div id="export-summary"></div>
      <div class="section"><div class="table-wrap" id="export-table"></div></div>
    </div>

    <!-- Marketing -->
    <div class="tab-content" id="tab-marketing">
      <h2 style="font-size:18px;font-weight:600;margin-bottom:16px;">Marketing &amp; Automation</h2>
      <div class="mkt-channels" id="mkt-channels"></div>

      <div class="section">
        <div class="section-header">
          <div class="section-title">Automation Jobs (pg_cron)</div>
          <span style="font-size:12px;color:var(--text-secondary)">15 active jobs</span>
        </div>
        <div class="section-body"><div class="table-wrap" id="cron-table"></div></div>
      </div>

      <div class="section">
        <div class="section-header"><div class="section-title">Recent Blog Posts</div></div>
        <div class="section-body" id="blog-table"></div>
      </div>

      <div class="section">
        <div class="section-header"><div class="section-title">SEO Scores by Page</div></div>
        <div class="section-body" id="seo-table"></div>
      </div>

      <div class="section">
        <div class="section-header"><div class="section-title">External Tools &amp; Links</div></div>
        <div class="section-body" id="ext-tools"></div>
      </div>
    </div>

    <!-- Settings -->
    <div class="tab-content" id="tab-settings">
      <h2 style="font-size:18px;font-weight:600;margin-bottom:16px;">Settings</h2>
      <div class="section">
        <div class="section-header"><div class="section-title">Commission</div></div>
        <div class="section-body" id="settings-commission"></div>
      </div>
      <div class="section">
        <div class="section-header"><div class="section-title">System Info</div></div>
        <div class="section-body" id="settings-system"></div>
      </div>
    </div>
  </main>
</div>

<!-- Modals -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title"></div>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- Toast container -->
<div class="toast-container" id="toast-container"></div>

<script>
// == Supabase ==
const SUPA_URL = 'https://ltupwgytuayzopnsdvpc.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0dXB3Z3l0dWF5em9wbnNkdnBjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5OTg5MzIsImV4cCI6MjA4ODU3NDkzMn0.bwPshMqh_NZc7MBSzbzbezOeMWm3e81iz3rJJSrrZhE';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

// == State ==
let ROLE = null;
let currentTab = 'dashboard';
let lastFetchTime = null;
let defaultCommission = 150;

// == Helpers ==
const BKK = { timeZone: 'Asia/Bangkok' };
function fmtDate(d) {
  if (!d) return '–';
  const dt = new Date(d);
  const day = dt.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric', ...BKK });
  const time = dt.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit', hour12:false, ...BKK });
  return `${day}, ${time}`;
}
function fmtNum(n, dec=2) {
  if (n == null) return '–';
  return Number(n).toLocaleString('en-US', { minimumFractionDigits:dec, maximumFractionDigits:dec });
}
function fmtBaht(n) { return n == null ? '–' : `฿${fmtNum(n)}`; }
function fmtKg(n) { return n == null ? '–' : `${fmtNum(n)} kg`; }
function timeAgo(d) {
  if (!d) return '';
  const mins = Math.floor((Date.now() - new Date(d).getTime())/60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins/60);
  if (hrs < 24) return `${hrs}h ago`;
  return `${Math.floor(hrs/24)}d ago`;
}
function esc(s) {
  if (s == null) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}
function daysOld(d) {
  if (!d) return 999;
  return Math.floor((Date.now() - new Date(d).getTime()) / 86400000);
}

// == Toast ==
function toast(msg, type='success') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity='0'; t.style.transform='translateX(40px)'; t.style.transition='0.3s ease'; }, 2500);
  setTimeout(() => t.remove(), 3000);
}

function showLoading(el) { el.innerHTML = '<div class="loading-center"><div class="spinner"></div></div>'; }

// == Tabs ==
const TABS = [
  { id:'dashboard', label:'Dashboard', icon:'&#9635;' },
  { id:'parcels', label:'Parcels', icon:'&#9744;' },
  { id:'leads', label:'Leads', icon:'&#9733;' },
  { id:'export', label:'Export', icon:'&#9992;' },
  { id:'marketing', label:'Marketing', icon:'&#9776;', admin:true },
  { id:'settings', label:'Settings', icon:'&#9881;', admin:true },
];
function renderTabs() {
  const bar = document.getElementById('tab-bar');
  bar.innerHTML = '';
  TABS.forEach(t => {
    if (t.admin && ROLE !== 'ADMIN') return;
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (t.id === currentTab ? ' active' : '');
    btn.innerHTML = `${t.label}`;
    btn.onclick = () => switchTab(t.id);
    bar.appendChild(btn);
  });
}
function switchTab(id) {
  currentTab = id;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.querySelector(`.tab-btn:nth-child(${TABS.filter(t=>!t.admin||ROLE==='ADMIN').findIndex(t=>t.id===id)+1})`).classList.add('active');
  document.getElementById(`tab-${id}`).classList.add('active');
  loadTabData(id);
}
function refreshCurrent() { loadTabData(currentTab); }
function updateLastFetch() {
  lastFetchTime = new Date();
  document.getElementById('last-update').textContent = `Updated ${fmtDate(lastFetchTime)}`;
}

// == Data loaders ==
async function loadTabData(tab) {
  try {
    switch(tab) {
      case 'dashboard': await loadDashboard(); break;
      case 'parcels': await loadParcels(); break;
      case 'leads': await loadLeads(); break;
      case 'export': await loadExport(); break;
      case 'marketing': await loadMarketing(); break;
      case 'settings': await loadSettings(); break;
    }
    updateLastFetch();
  } catch(e) { console.error(e); toast('Error loading data', 'error'); }
}

  const prices = pricesRes.data || [];

  // Summary cards
  const totalParcels = parcels.length;
  const totalKg = parcels.reduce((s,p) => s + (Number(p.actual_kg)||0), 0);
  const commEarned = parcels.filter(p => p.status==='settled').reduce((s,p) => s + (Number(p.commission_total)||0), 0);
  const commPending = parcels.filter(p => p.status!=='settled').reduce((s,p) => s + (Number(p.commission_total)|| (Number(p.estimated_kg)||0)*(Number(p.commission_per_kg)||defaultCommission) ), 0);

  sc.innerHTML = `
    <div class="card"><div class="card-label">Total Parcels</div><div class="card-value">${totalParcels}</div></div>

    <div class="card"><div class="card-label">Pending Commission</div><div class="card-value orange">${fmtBaht(commPending)}</div><div class="card-sub">Outstanding</div></div>
  `;

  // Prices
  const matNames = { carbide_inserts:'Carbide Inserts', carbide_drills:'Carbide Drills', mixed_carbide:'Mixed Carbide', sand_rills:'Sand Rills' };
  if (prices.length === 0) {
    pg.innerHTML = '<div class="empty-state">No price data available</div>';
  } else {
    pg.innerHTML = prices.map(p => `
      <div class="price-card">
        <div class="price-card-header">
          <div><div class="price-card-name">${esc(p.name_en || matNames[p.key] || p.key)}</div><div class="price-card-name-th">${esc(p.name_th||'')}</div></div>
        </div>
        <div class="price-tier"><span class="price-tier-label">Teaser</span><span class="price-tier-value">${fmtBaht(p.teaser_thb)}</span></div>
        <div class="price-tier"><span class="price-tier-label">&lt; 10 kg</span><span class="price-tier-value">${fmtBaht(p.tier_under10)}</span></div>
        <div class="price-tier"><span class="price-tier-label">10-30 kg</span><span class="price-tier-value">${fmtBaht(p.tier_10_30)}</span></div>
        <div class="price-tier"><span class="price-tier-label">30-50 kg</span><span class="price-tier-value">${fmtBaht(p.tier_30_50)}</span></div>
        <div class="price-updated">Updated: ${fmtDate(p.updated_at)}</div>
      </div>
    `).join('');
  }

  // Activity
  const recent = [...parcels].sort((a,b) => new Date(b.created_at)-new Date(a.created_at)).slice(0,10);
  if (recent.length === 0) {
    af.innerHTML = '<div class="empty-state">No parcels yet</div>';
  } else {
    const statusColors = { pending:'#bdc3c7', delivered:'#3498db', weighed:'#f39c12', paid:'#27ae60', settled:'#9b59b6' };
    af.innerHTML = recent.map(p => `
      <div class="activity-item">

        <div class="activity-text">
          <strong>${esc(p.seller_name||'Unknown')}</strong> &mdash; ${esc(matNames[p.material_type]||p.material_type)} (${fmtNum(p.estimated_kg||0,1)} kg est.)

        </div>

      <td>${fmtBaht(p.total_thb)}</td>

function parcelActions(p) {
  let btns = '';
  if (ROLE === 'ADMIN') {
    btns += `<button class="btn btn-secondary btn-sm" onclick="openEditParcel('${p.id}')">Edit</button> `;
    if (p.status === 'pending') btns += `<button class="btn btn-sm btn-orange" onclick="changeParcelStatus('${p.id}','delivered')">Mark Delivered</button> `;
    if (p.status === 'weighed') btns += `<button class="btn btn-sm btn-primary" onclick="changeParcelStatus('${p.id}','paid')">Mark Paid</button> `;
    if (p.status === 'paid') btns += `<button class="btn btn-sm" style="background:var(--accent-purple);color:#fff;" onclick="changeParcelStatus('${p.id}','settled')">Settle</button> `;
  }
  if (ROLE === 'PARTNER' && p.status === 'delivered') {
    btns += `<button class="btn btn-sm btn-orange" onclick="openWeighModal('${p.id}', ${p.price_per_kg||0}, ${p.commission_per_kg||defaultCommission})">Confirm Weight</button>`;
  }
  return btns || '–';
}

async function changeParcelStatus(id, status) {
  const updates = { status };
  if (status === 'delivered') updates.delivered_at = new Date().toISOString();
  if (status === 'paid') updates.paid_at = new Date().toISOString();
  if (status === 'settled') updates.settled_at = new Date().toISOString();
  const { error } = await sb.from('parcels').update(updates).eq('id', id);
  if (error) { toast('Error updating status', 'error'); return; }
  toast(`Parcel marked as ${status}`);
  loadParcels();
}

function openWeighModal(id, ppk, cpk) {
  openModal('Confirm Weight', `
    <div class="form-group">
      <label class="form-label">Actual Weight (kg)</label>
      <input type="number" step="0.01" min="0" class="form-input" id="weigh-kg" placeholder="Enter actual kg">
    </div>
    <p style="font-size:13px;color:var(--text-secondary)">Price/kg: ${fmtBaht(ppk)} &bull; Commission/kg: ${fmtBaht(cpk)}</p>
  `, `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitWeight('${id}',${ppk},${cpk})">Confirm</button>`);
  setTimeout(() => document.getElementById('weigh-kg')?.focus(), 100);
}

async function submitWeight(id, ppk, cpk) {
  const kg = parseFloat(document.getElementById('weigh-kg').value);
  if (!kg || kg <= 0) { toast('Enter a valid weight', 'error'); return; }
  const total = kg * ppk;
  const commTotal = kg * cpk;
  const { error } = await sb.from('parcels').update({
    actual_kg: kg, total_thb: total, commission_total: commTotal,
    status: 'weighed', weighed_at: new Date().toISOString()
  }).eq('id', id);
  if (error) { toast('Error saving weight', 'error'); return; }
  closeModal(); toast('Weight confirmed'); loadParcels();
}

async function saveParcel() {
  const obj = {
    seller_name: document.getElementById('p-seller').value.trim(),
    seller_contact: document.getElementById('p-contact').value.trim(),
    material_type: document.getElementById('p-material').value,
    source: document.getElementById('p-source').value,
    estimated_kg: parseFloat(document.getElementById('p-estkg').value) || null,
    actual_kg: parseFloat(document.getElementById('p-actkg').value) || null,
    price_per_kg: parseFloat(document.getElementById('p-ppk').value) || null,
    commission_per_kg: parseFloat(document.getElementById('p-cpk').value) || defaultCommission,
    status: document.getElementById('p-status').value,
    export_buyer: document.getElementById('p-exbuyer').value.trim() || null,
    export_status: document.getElementById('p-exstatus').value,
    notes: document.getElementById('p-notes').value.trim() || null,
  };
  if (obj.actual_kg && obj.price_per_kg) obj.total_thb = obj.actual_kg * obj.price_per_kg;
  if (obj.actual_kg && obj.commission_per_kg) obj.commission_total = obj.actual_kg * obj.commission_per_kg;
  if (obj.status === 'delivered' && !editingParcelId) obj.delivered_at = new Date().toISOString();
  if (obj.status === 'weighed') obj.weighed_at = new Date().toISOString();
  if (obj.status === 'paid') obj.paid_at = new Date().toISOString();
  if (obj.status === 'settled') obj.settled_at = new Date().toISOString();

  let error;
  if (editingParcelId) {
    ({ error } = await sb.from('parcels').update(obj).eq('id', editingParcelId));
  } else {
    ({ error } = await sb.from('parcels').insert(obj));
  }
  if (error) { toast('Error saving parcel: ' + error.message, 'error'); return; }
  closeModal(); toast(editingParcelId ? 'Parcel updated' : 'Parcel created'); loadParcels();
}

async function openEditLead(id) {
  const { data, error } = await sb.from('leads').select('*').eq('id', id).single();
  if (error || !data) { toast('Error loading lead', 'error'); return; }
  openLeadModal(data);
}

async function saveLead() {
  const obj = {
    display_name: document.getElementById('l-name').value.trim(),
    phone: document.getElementById('l-phone').value.trim() || null,
    email: document.getElementById('l-email').value.trim() || null,
    line_id: document.getElementById('l-line').value.trim() || null,
    location: document.getElementById('l-loc').value.trim() || null,
    source: document.getElementById('l-source').value,
    material_type: document.getElementById('l-material').value || null,
    weight_kg: parseFloat(document.getElementById('l-kg').value) || null,
    lead_score: parseInt(document.getElementById('l-score').value) || null,
    status: document.getElementById('l-status').value,
    quoted_price: parseFloat(document.getElementById('l-qprice').value) || null,
    has_photos: document.getElementById('l-photos').value === 'true',
    notes: document.getElementById('l-notes').value.trim() || null,
    updated_at: new Date().toISOString(),
  };
  let error;
  if (editingLeadId) {
    ({ error } = await sb.from('leads').update(obj).eq('id', editingLeadId));
  } else {
    ({ error } = await sb.from('leads').insert(obj));
  }
  if (error) { toast('Error saving lead: ' + error.message, 'error'); return; }
  closeModal(); toast(editingLeadId ? 'Lead updated' : 'Lead created'); loadLeads();
}

// == Export ==
async function loadExport() {
  const sumEl = document.getElementById('export-summary');
  const tblEl = document.getElementById('export-table');
  showLoading(tblEl);

  const { data:parcels, error } = await sb.from('parcels').select('*').not('export_buyer','is',null).neq('export_buyer','').order('created_at', { ascending:false });
  if (error) { toast('Error loading export data', 'error'); return; }
  if (!parcels || parcels.length === 0) {
    sumEl.innerHTML = '';
    tblEl.innerHTML = '<div class="empty-state"><div class="empty-state-icon">&#9992;</div>No export parcels yet</div>';
    return;
  }
  const byBuyer = {};
  parcels.forEach(p => {
    const b = p.export_buyer;
    if (!byBuyer[b]) byBuyer[b] = { kg:0, count:0, value:0 };
    byBuyer[b].kg += Number(p.actual_kg||p.estimated_kg||0);
    byBuyer[b].count++;
    byBuyer[b].value += Number(p.total_thb||0);
  });
  sumEl.innerHTML = '<div class="export-summary">' + Object.entries(byBuyer).map(([buyer, s]) => `
    <div class="export-card">
      <div class="export-buyer-name">${esc(buyer)}</div>
      <div class="export-stat">Parcels: <strong>${s.count}</strong></div>
      <div class="export-stat">Total kg: <strong>${fmtNum(s.kg,1)}</strong></div>
      <div class="export-stat">Value: <strong>${fmtBaht(s.value)}</strong></div>
    </div>
  `).join('') + '</div>';

  const matNames = { carbide_inserts:'Inserts', carbide_drills:'Drills', mixed_carbide:'Mixed', sand_rills:'Sand Rills' };
  tblEl.innerHTML = `<table>
    <thead><tr><th>Date</th><th>Buyer</th><th>Seller</th><th>Material</th><th>kg</th><th>Total ฿</th><th>Export Status</th></tr></thead>
    <tbody>${parcels.map(p => `<tr>
      <td>${fmtDate(p.created_at)}</td>
      <td><strong>${esc(p.export_buyer)}</strong></td>
      <td>${esc(p.seller_name||'–')}</td>
      <td>${esc(matNames[p.material_type]||p.material_type)}</td>
      <td>${fmtNum(p.actual_kg||p.estimated_kg||0,1)}</td>
      <td>${fmtBaht(p.total_thb)}</td>
      <td><span class="badge badge-${p.export_status||'none'}">${p.export_status||'none'}</span></td>
    </tr>`).join('')}</tbody>
  </table>`;
}

async function loadSettings() {

      </div>

  `;

  let supaOk = false;
  let priceUpdate = '–';
  try {
    const { data } = await sb.from('prices').select('updated_at').order('updated_at', { ascending:false }).limit(1);
    if (data && data.length) { supaOk = true; priceUpdate = fmtDate(data[0].updated_at); }

  } catch(e) { supaOk = false; }

  sysEl.innerHTML = `
    <div class="settings-row">
      <div class="settings-label">Supabase Connection</div>
      <div class="settings-value"><span class="status-dot ${supaOk?'ok':'err'}"></span>${supaOk?'Connected':'Error'}</div>

      <div class="settings-label">Current Role</div>
      <div class="settings-value">${ROLE}</div>
    </div>

      <div class="settings-value">2.0.0</div>

function saveCommission() {
  const v = parseInt(document.getElementById('set-commission').value);
  if (!v || v <= 0) { toast('Enter a valid commission', 'error'); return; }
  defaultCommission = v;
  localStorage.setItem('tc_commission', v);
  toast(`Commission rate set to ฿${v}/kg`);
}

// == Modal ==
function openModal(title, body, footer) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal-footer').innerHTML = footer;
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  editingParcelId = null;
  editingLeadId = null;
}
document.getElementById('modal-overlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// == Init ==
function initApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  const badge = document.getElementById('role-badge');
  badge.textContent = ROLE;
  badge.className = 'role-badge' + (ROLE === 'PARTNER' ? ' partner' : '');
  const sc = localStorage.getItem('tc_commission');
  if (sc) defaultCommission = parseInt(sc);
  renderTabs();
  switchTab('dashboard');
}
checkSession();
