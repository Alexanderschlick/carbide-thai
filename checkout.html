<html lang="th" class="notranslate" translate="no">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ขายคาร์ไบด์ — ThaiCarbide</title>
<meta name="robots" content="noindex">

<meta http-equiv="refresh" content="0; url=/sell.html">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
/* ThaiCarbide — shared v4 design system (soft industrial) */
:root{--bg:#0c1526;--panel:#111d33;--panel2:#16233d;--gold:#c9a35c;--gold-soft:#e0c48c;--royal:#5b74e0;--steel:#9fb0c6;--ink:#eef1f6;--muted:#8493ab;--hair:rgba(159,176,210,.15);--r:10px}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:'Inter','Sarabun',system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.65}
body.lang-th{font-family:'Sarabun','Inter',sans-serif}
body.lang-th .en{display:none!important}body.lang-en .th{display:none!important}
.gk{font-family:'Space Grotesk',sans-serif}body.lang-th .gk{font-family:'Space Grotesk','Sarabun',sans-serif}
.mono{font-family:'IBM Plex Mono',monospace}

.wrap{max-width:1000px;margin:0 auto;padding:0 40px}
.hr{height:1px;background:var(--hair);max-width:1000px;margin:0 auto}

.nav a{color:var(--muted);text-decoration:none;font-size:14px}.nav a:hover{color:var(--ink)}

.lang button.on{border-color:var(--gold);color:var(--gold)}
.pill{font-family:'IBM Plex Mono',monospace;border:1px solid rgba(201,163,92,.5);color:var(--gold);padding:7px 13px;border-radius:8px;font-size:12px;text-decoration:none}
.hero{text-align:center;padding:74px 0 40px}

.quote{display:inline-block;border:1px solid var(--hair);border-radius:14px;background:var(--panel);padding:16px 30px;margin-bottom:26px}
.quote .lbl{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.quote .amt{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:44px;color:var(--gold-soft);line-height:1.05}
.quote .amt u{font-family:'IBM Plex Mono',monospace;text-decoration:none;font-size:18px;color:var(--muted)}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:500;padding:13px 26px;border-radius:var(--r);text-decoration:none;display:inline-flex;align-items:center;gap:9px;transition:.18s;cursor:pointer;border:none}
.btn-primary{background:var(--gold);color:#0c1526}.btn-primary:hover{background:var(--gold-soft)}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid rgba(238,241,246,.18)}.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn-royal{background:var(--royal);color:#fff}.btn-royal:hover{background:#6f85e8}
.sec-head{display:flex;align-items:baseline;gap:14px;padding:52px 0 26px}
.sec-head .idx{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--gold);letter-spacing:.1em}
.sec-head h2{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:24px;letter-spacing:-.01em}
.prose{color:var(--muted);font-size:16px;line-height:1.8;max-width:760px}
.prose b{color:var(--ink);font-weight:500}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{border:1px solid var(--hair);border-radius:14px;background:var(--panel);padding:22px 20px}
.card .ic{width:24px;height:24px;stroke:var(--gold);fill:none;stroke-width:1.4;margin-bottom:12px;display:block}
.card h3{font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:17px;margin-bottom:6px}
.card p{font-size:13px;color:var(--muted)}
.card .free{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--gold);letter-spacing:.05em;margin-top:10px;display:inline-block}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px 0 0}
.chip{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--steel);border:1px solid var(--hair);border-radius:8px;padding:6px 11px}
.final{text-align:center;padding:64px 0}
.final h2{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:clamp(26px,4vw,38px);margin-bottom:10px}
.final p{color:var(--muted);margin-bottom:24px}
footer{border-top:1px solid var(--hair);padding:38px 0 56px;margin-top:36px}
footer .cols{display:flex;justify-content:space-between;gap:26px;flex-wrap:wrap;color:var(--muted);font-size:13px}
footer a{color:var(--muted);text-decoration:none}footer a:hover{color:var(--ink)}
footer .legal{font-size:12px;color:var(--muted);margin-top:22px;padding-top:18px;border-top:1px solid var(--hair);line-height:1.7}
@media(max-width:820px){.nav .navlink{display:none}.grid3,.grid4{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.grid3,.grid4{grid-template-columns:1fr}}

</style>
</head>
